version: "2"
linters:
  default: none
  enable:
    - asciicheck
    - copyloopvar
    - cyclop
    - dupword
    - durationcheck
    - errcheck
    - errname
    - errorlint
    - exhaustive
    - forcetypeassert
    - funlen
    - gocheckcompilerdirectives
    - gocritic
    - godot
    - gosec
    - govet
    - importas
    - ineffassign
    - lll
    - makezero
    - nestif
    - nilerr
    - nolintlint
    - promlinter
    - staticcheck
    - tagliatelle
    - testpackage
    - unconvert
    - unparam
    - unused
    - wastedassign
    - whitespace
  settings:
    tagliatelle:
      case:
        rules:
          json: snake
        use-field-name: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
